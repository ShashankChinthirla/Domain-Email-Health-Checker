name: Daily Cloudflare Sync & New Domain Scan

on:
  schedule:
    - cron: '0 5 * * *' # Runs at 05:00 UTC (10:30 AM IST) every day
  workflow_dispatch: # Allows manual triggering as well

jobs:
  sync-and-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Stage 1 - Sync New Cloudflare Domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "🚀 Pulling newest domains from Cloudflare..."
          npx tsx scripts/sync_cloudflare.ts

      - name: Stage 2 - Cross-Collection User Mapping
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "👥 Matching domain owners from dfyinfrasetups..."
          npx tsx scripts/sync_users.ts

      - name: Stage 3 - Deep DNS Rescan Validation
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "🔍 Veryifying updates with strict deep scanner..."
          npx tsx scripts/rescan_db_v3.ts --new
