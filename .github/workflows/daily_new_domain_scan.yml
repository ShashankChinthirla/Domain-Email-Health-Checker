name: Daily Cloudflare Sync & New Domain Scan

on:
  schedule:
    - cron: '0 5 * * *' # Runs at 05:00 UTC (10:30 AM IST) every day
  workflow_dispatch: # Allows manual triggering as well

jobs:
  sync-and-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync New Cloudflare Domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          # We run the dedicated CLI sync script directly to safely bypass needing a live production URL
          npx tsx scripts/sync_cloudflare.ts

      - name: Run Background Scanner For New Domains ONLY
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scripts/rescan_db_v3.ts --new
