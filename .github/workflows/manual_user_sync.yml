name: Manual User Sync (dfyinfrasetups)

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  sync-users:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cross-Collection User Mapping
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "👥 Matching domain owners from dfyinfrasetups to issue_domains..."
          npx tsx scripts/sync_users.ts
